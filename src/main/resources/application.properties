spring.application.name=nutri

api.version=v1

app.database.host=${DB_HOST:192.168.1.100}
spring.datasource.url=jdbc:sqlserver://${DB_HOST:192.168.1.100}:${DB_PORT:1433};databaseName=NutriSalud;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:nutri}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.properties.hibernate.scan=com.nutriSalud.nutri.models

# ===== SEGURIDAD =====
# JWT (secreto al menos 256-bit: cadenas de 32+ chars o Base64)
jwt.secreto=${JWT_SECRET:UHJveWVjdG9TdXBlclNlY3JldGEtMjU2Yml0cy1qd3QtbnV0cmlzYWx1ZA==}
jwt.vencimiento-minutos=${JWT_MINUTOS:120}

# CORS (Angular corre por defecto en http://localhost:4200)
cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080,http://127.0.0.1:4200,http://127.0.0.1:8080}

# Usuario admin por defecto (seed inicial)
nutrisalud.admin.username=${ADMIN_USER:admin}
nutrisalud.admin.password=${ADMIN_PASS:Nutri2026!}
nutrisalud.ciudadano.default.username=${CIUDADANO_USER:ciudadano1}
nutrisalud.ciudadano.default.password=${CIUDADANO_PASS:Ciudadano2026!}

# ===== SWAGGER / OPENAPI (SpringDoc) =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.packages-to-scan=com.nutriSalud.nutri.controllers
springdoc.paths-to-match=/api/v1/**
