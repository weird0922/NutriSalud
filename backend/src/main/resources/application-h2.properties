# ===== PERFIL H2 (SIN SQL SERVER) =====
# USO: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=h2"
spring.application.name=nutri-h2

api.version=v1

spring.datasource.url=jdbc:h2:mem:nutrilaunch;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.scan=com.nutriSalud.nutri.models

jwt.secreto=${JWT_SECRET:UHJveWVjdG9TdXBlclNlY3JldGEtMjU2Yml0cy1qd3QtbnV0cmlzYWx1ZA==}
jwt.vencimiento-minutos=${JWT_MINUTOS:120}

cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080,http://127.0.0.1:4200,http://127.0.0.1:8080}

nutrisalud.admin.username=${ADMIN_USER:admin}
nutrisalud.admin.password=${ADMIN_PASS:Nutri2026!}
nutrisalud.ciudadano.default.username=${CIUDADANO_USER:ciudadano1}
nutrisalud.ciudadano.default.password=${CIUDADANO_PASS:Ciudadano2026!}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.packages-to-scan=com.nutriSalud.nutri.controllers
springdoc.paths-to-match=/api/v1/**
